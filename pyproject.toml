[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aiface"
version = "0.1.0"
description = "Chat-driven photoreal avatar face with biomechanical muscle simulation on a locked GPU field substrate"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "insightits" }]
keywords = [
    "avatar",
    "face",
    "biomechanics",
    "opengl",
    "moderngl",
    "lipsync",
    "streaming",
    "tts",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: GPU",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Graphics :: 3D Rendering",
]
dependencies = [
    "moderngl>=5.8",
    "moderngl-window>=2.4",
    "numpy>=1.24",
    "Pillow>=10.0",
]

[project.optional-dependencies]
seed = ["opencv-python-headless>=4.8", "mediapipe>=0.10"]
voice = ["sounddevice>=0.4"]
dev = [
    "pytest>=7.4",
    "opencv-python-headless>=4.8",
    "sounddevice>=0.4",
    "mediapipe>=0.10",
    "scikit-learn>=1.3",
    "joblib>=1.3",
]
ml = [
    "scikit-learn>=1.3",
    "joblib>=1.3",
    "opencv-python-headless>=4.8",
    "mediapipe>=0.10",
]

[project.scripts]
aiface = "aiface.cli:main_app"
aiface-seed = "aiface.cli:main_seed"
aiface-capture = "aiface.cli:main_capture"
aiface-sync = "aiface.cli:main_sync"
amin-train = "amin_loop.cli:main"

[project.urls]
Homepage = "https://github.com/insightitsGit/AIFace"
Source = "https://github.com/insightitsGit/AIFace"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
aiface = [
    "shaders/*.vert",
    "shaders/*.frag",
    "shaders/*.comp",
    "biomechanics/data/*.json",
    "data/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::PendingDeprecationWarning"]
