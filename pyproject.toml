[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chorusface"
version = "0.2.0b1"
description = "Host-driven photoreal avatar face (product beta): host owns LLM+TTS; TickFeed LOOK/FIELD + /voice/* lip-lock"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "insightits" }]
keywords = [
    "avatar",
    "face",
    "biomechanics",
    "opengl",
    "moderngl",
    "lipsync",
    "streaming",
    "tts",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: GPU",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Graphics :: 3D Rendering",
]
dependencies = [
    "moderngl>=5.8",
    "moderngl-window>=2.4",
    "numpy>=1.24",
    "Pillow>=10.0",
    "cryptography>=42",
]

[project.optional-dependencies]
seed = ["opencv-python-headless>=4.8", "mediapipe>=0.10"]
voice = ["sounddevice>=0.4"]
dev = [
    "pytest>=7.4",
    "opencv-python-headless>=4.8",
    "sounddevice>=0.4",
    "mediapipe>=0.10",
    "scikit-learn>=1.3",
    "joblib>=1.3",
]
ml = [
    "scikit-learn>=1.3",
    "joblib>=1.3",
    "opencv-python-headless>=4.8",
    "mediapipe>=0.10",
]

[project.scripts]
chorusface = "chorusface.cli:main_app"
chorusface-beta = "chorusface.cli:main_beta"
chorusface-service = "chorusface.cli:main_service"
chorusface-host = "chorusface.host_client:main"
chorusface-prism = "chorusface.prism_adapter:main"
chorusface-seed = "chorusface.cli:main_seed"
chorusface-capture = "chorusface.cli:main_capture"
chorusface-sync = "chorusface.cli:main_sync"
chorusface-vowel = "chorusface.vowel.cli:main"
amin-train = "amin_loop.cli:main"

[project.urls]
Homepage = "https://github.com/insightitsGit/ChorusFace"
Source = "https://github.com/insightitsGit/ChorusFace"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
chorusface = [
    "shaders/*.vert",
    "shaders/*.frag",
    "shaders/*.comp",
    "biomechanics/data/*.json",
    "data/*",
    "vowel/data/*.json",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::PendingDeprecationWarning"]
